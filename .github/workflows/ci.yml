name: Build and Release

on:
  push:
    branches-ignore: [automation/release-notes]
    tags: ['v*']
  pull_request:
  schedule:
    # Monday 09:17 Asia/Shanghai (UTC+8).
    - cron: '17 1 * * 1'
  workflow_dispatch:
    inputs:
      weekly_release:
        description: Check for changes and publish the next patch release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' || inputs.weekly_release == true }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'schedule' && inputs.weekly_release != true }}

jobs:
  metadata:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      build: ${{ steps.version.outputs.build }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          AUTO_RELEASE: ${{ github.event_name == 'schedule' || inputs.weekly_release == true }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$AUTO_RELEASE" == true ]]; then
            [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo "Weekly release must run on the default branch"; exit 1; }
            python3 scripts/weekly_release.py
          elif [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected vX.Y.Z tag"; exit 1; }
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$AUTO_RELEASE" != true ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          [[ "$(cat .sdk-version)" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Create immutable weekly tag
        if: steps.version.outputs.create_tag == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
          # GITHUB_TOKEN tag pushes do not trigger another run. This run builds
          # the exact checkout and publishes the tag after all jobs succeed.

  readers:
    if: needs.metadata.outputs.build == 'true'
    needs: metadata
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    env:
      CI_COMMIT_TAG: ${{ needs.metadata.outputs.tag }}
      ASSET_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ patchelf libeigen3-dev
          python -m pip install 'conan>=2,<3' pytest numpy
      - name: Build readers and tests without robot SDK
        run: |
          ./scripts/build.sh --with-sdk OFF --tests ON
          ./scripts/run_tests.sh -t Release
          python -m pytest unittests -q
          ./scripts/check_python_examples.sh
      - name: Build and test wheel
        run: |
          ./scripts/build_py.sh --no-install
          ./scripts/run_test_py.sh -t Release
      - name: Package C++ readers
        if: matrix.python == '3.10'
        run: python scripts/package_release.py --install build_Release/install --output dist --version "$ASSET_VERSION"
      - name: Stage reader artifacts in one directory
        run: |
          mkdir -p dist
          cp python/dist/*.whl dist/
      - uses: actions/upload-artifact@v4
        with:
          name: readers-python-${{ matrix.python }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  sdk-bridge:
    if: needs.metadata.outputs.build == 'true'
    needs: metadata
    runs-on: ubuntu-22.04
    env:
      CI_COMMIT_TAG: ${{ needs.metadata.outputs.tag }}
      ASSET_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ curl
          python -m pip install 'conan>=2,<3'
      - name: Download exact official SDK release
        run: |
          export SDK_RELEASE_TAG="v$(cat .sdk-version)"
          ./scripts/download.sh
      - name: Build SpaceMouse and force/torque SDK applications
        run: |
          ./scripts/build.sh --with-sdk ON --with-pico OFF --tests OFF
          ldd build_Release/install/bin/app_peripherals_bridge | grep librcoresdk
      - name: Package bridge with SDK runtime and attribution
        run: |
          python scripts/package_release.py --install build_Release/install \
            --sdk-root third_party/smrcore_sdk --output dist --version "$ASSET_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-bridge-linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  manual:
    if: needs.metadata.outputs.build == 'true'
    needs: metadata
    runs-on: ubuntu-22.04
    env:
      ASSET_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-lang-chinese fonts-noto-cjk fonts-dejavu-core lmodern texlive-fonts-recommended texlive-latex-extra
      - name: Build Chinese and English PDF and HTML manuals
        run: ./scripts/build_manual.sh dist "$ASSET_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: manuals
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: needs.metadata.outputs.tag != '' && (github.event_name == 'push' || github.event_name == 'schedule' || inputs.weekly_release == true)
    needs: [metadata, readers, sdk-bridge, manual]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          (cd dist && sha256sum *.tar.gz *.whl *.pdf *.html > SHA256SUMS)
          python3 scripts/release_notes.py --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" --output /tmp/release-notes.md
          gh release create "$RELEASE_TAG" dist/* --verify-tag \
            --title "$RELEASE_TAG" --notes-file /tmp/release-notes.md
