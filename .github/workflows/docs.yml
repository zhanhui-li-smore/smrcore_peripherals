name: Documentation site
on:
  push:
    branches: [main, feat/pico-readers-and-release]
  pull_request:
  workflow_run:
    workflows: [Build and Release]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate bilingual release notes
        run: python scripts/version_history.py --repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: version-notes
          path: docs/site/release-notes*.md
          if-no-files-found: error
          retention-days: 14
      - run: python -m pip install -r docs/requirements.txt
      - name: Build site
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          export PERIPHERALS_SITE_URL="https://${OWNER}.github.io/${REPO}/"
          python -m mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (github.repository == 'zhanhui-li-smore/smrcore_peripherals' && github.ref == 'refs/heads/feat/pico-readers-and-release'))
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
